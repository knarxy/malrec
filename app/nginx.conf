server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached or
    # the app pins itself to an old bundle after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Same-origin proxy to the backend, so the browser needs no CORS handling
    # and the API does not have to be published on its own port.
    #
    # The upstream is a variable so nginx re-resolves "api" through Docker's
    # DNS instead of pinning the IP it saw at startup - otherwise every API
    # container restart leaves the app answering 502 until it is restarted too.
    #
    # The API rate-limits by client address, so it gets exactly one, decided
    # here: from a reverse proxy on a Docker network (172.16.0.0/12, where
    # the host's proxy reaches this container) the client it names, from
    # anyone else - a VPN peer on the published port - their own address.
    # Appending to the header let a direct client choose its address, and a
    # fresh rate-limit budget, per request (audit 2026-10-23, SEC-5).
    location /api/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set $upstream      http://api:8000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        set_real_ip_from   172.16.0.0/12;
        real_ip_header     X-Forwarded-For;
        real_ip_recursive  on;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # onboarding polls a job that can take minutes
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
